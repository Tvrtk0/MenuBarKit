<svg xmlns="http://www.w3.org/2000/svg" width="520" height="560" viewBox="0 0 520 560" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif">
  <defs>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a1466"/>
      <stop offset="0.6" stop-color="#6b1f8a"/>
      <stop offset="1" stop-color="#a02f7c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.25" cy="0.8" r="0.7">
      <stop offset="0" stop-color="#ff7a45" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff7a45" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfd8e6"/>
      <stop offset="1" stop-color="#e9edf3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.22"/>
    </filter>
    <clipPath id="artClip"><rect x="146" y="54" width="268" height="268" rx="8"/></clipPath>
    <clipPath id="miniArtClip"><rect x="153" y="5" width="18" height="18" rx="3"/></clipPath>
    <!-- Generic placeholder artwork, drawn in a 100×100 box and scaled where used. -->
    <g id="cover">
      <rect width="100" height="100" fill="url(#art)"/>
      <rect width="100" height="100" fill="url(#glow)"/>
      <!-- Flowing psychedelic waves, bunching up toward the middle. -->
      <g fill="none" stroke-linecap="round">
        <path d="M-5 22 C 20 10, 40 34, 62 24 S 92 8, 105 16" stroke="#ffd2a8" stroke-opacity="0.35" stroke-width="1"/>
        <path d="M-5 32 C 20 18, 42 46, 64 34 S 92 18, 105 26" stroke="#ff9a5c" stroke-opacity="0.55" stroke-width="1.5"/>
        <path d="M-5 41 C 22 26, 44 58, 66 44 S 94 28, 105 36" stroke="#ffffff" stroke-opacity="0.8" stroke-width="2.5"/>
        <path d="M-5 48 C 22 34, 44 66, 66 52 S 94 36, 105 44" stroke="#ff6f61" stroke-opacity="0.75" stroke-width="2"/>
        <path d="M-5 55 C 22 42, 44 73, 66 60 S 94 44, 105 52" stroke="#ffb36b" stroke-opacity="0.7" stroke-width="1.5"/>
        <path d="M-5 64 C 20 52, 42 82, 64 70 S 92 54, 105 62" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.2"/>
        <path d="M-5 75 C 20 64, 40 92, 62 82 S 92 66, 105 74" stroke="#ff9a5c" stroke-opacity="0.35" stroke-width="1"/>
        <path d="M-5 87 C 20 78, 40 102, 62 94 S 92 80, 105 86" stroke="#ffd2a8" stroke-opacity="0.2" stroke-width="1"/>
      </g>
    </g>
  </defs>

  <!-- desktop -->
  <rect width="520" height="560" fill="url(#desk)"/>

  <!-- menu bar -->
  <rect width="520" height="28" fill="#f4f5f7" fill-opacity="0.92"/>
  <line x1="0" y1="28" x2="520" y2="28" stroke="#000" stroke-opacity="0.08"/>

  <!-- MenuBarKit item (highlighted: popover open) -->
  <rect x="146" y="3" width="254" height="22" rx="5" fill="#000" fill-opacity="0.1"/>
  <g clip-path="url(#miniArtClip)">
    <use href="#cover" transform="translate(153 5) scale(0.18)"/>
  </g>
  <text x="177" y="18.5" font-size="13" fill="#1d1d1f">Artist Name – Song Title</text>
  <rect x="343" y="12.5" width="50" height="3" rx="1.5" fill="#1d1d1f" fill-opacity="0.25"/>
  <rect x="343" y="12.5" width="32" height="3" rx="1.5" fill="#1d1d1f"/>

  <!-- system items -->
  <g fill="none" stroke="#1d1d1f" stroke-width="1.6" stroke-linecap="round">
    <path d="M428 12 a9 9 0 0 1 12 0"/>
    <path d="M431 15 a5 5 0 0 1 6 0"/>
  </g>
  <circle cx="434" cy="18" r="1.4" fill="#1d1d1f"/>
  <rect x="450" y="9" width="22" height="11" rx="3" fill="none" stroke="#1d1d1f" stroke-opacity="0.6"/>
  <rect x="452" y="11" width="15" height="7" rx="1.5" fill="#1d1d1f"/>
  <rect x="473" y="12.5" width="1.6" height="4" rx="0.8" fill="#1d1d1f" fill-opacity="0.6"/>
  <text x="510" y="18.5" font-size="13" fill="#1d1d1f" text-anchor="end">14:32</text>

  <!-- popover -->
  <g filter="url(#shadow)">
    <path d="M142 38 H265 L273 30 L281 38 H418 a12 12 0 0 1 12 12 V528 a12 12 0 0 1 -12 12 H142 a12 12 0 0 1 -12 -12 V50 a12 12 0 0 1 12 -12 Z" fill="#fbfbfc"/>
  </g>
  <path d="M142 38 H265 L273 30 L281 38 H418 a12 12 0 0 1 12 12 V528 a12 12 0 0 1 -12 12 H142 a12 12 0 0 1 -12 -12 V50 a12 12 0 0 1 12 -12 Z" fill="none" stroke="#000" stroke-opacity="0.1"/>

  <!-- artwork -->
  <g clip-path="url(#artClip)">
    <use href="#cover" transform="translate(146 54) scale(2.68)"/>
  </g>

  <!-- track info -->
  <text x="280" y="347" font-size="13" font-weight="600" fill="#1d1d1f" text-anchor="middle">Song Title</text>
  <text x="280" y="365" font-size="13" fill="#6e6e73" text-anchor="middle">Artist Name</text>
  <text x="280" y="381" font-size="10.5" fill="#a1a1a6" text-anchor="middle">Album Name</text>

  <!-- seek slider -->
  <rect x="146" y="401" width="268" height="4" rx="2" fill="#000" fill-opacity="0.1"/>
  <rect x="146" y="401" width="172" height="4" rx="2" fill="#0a84ff"/>
  <circle cx="318" cy="403" r="7" fill="#fff" stroke="#000" stroke-opacity="0.15"/>
  <text x="146" y="424" font-size="10.5" fill="#6e6e73">2:13</text>
  <text x="414" y="424" font-size="10.5" fill="#6e6e73" text-anchor="end">3:28</text>

  <!-- controls -->
  <g fill="#1d1d1f">
    <path d="M222 449 L222 465 L211 457 Z M233 449 L233 465 L222 457 Z"/>
    <rect x="270" y="444" width="7" height="26" rx="2"/>
    <rect x="283" y="444" width="7" height="26" rx="2"/>
    <path d="M327 449 L327 465 L338 457 Z M338 449 L338 465 L349 457 Z"/>
  </g>

  <!-- footer -->
  <line x1="146" y1="492" x2="414" y2="492" stroke="#000" stroke-opacity="0.1"/>
  <text x="146" y="518" font-size="13" fill="#0a84ff">Open Spotify</text>
  <g transform="translate(406 514)" fill="none" stroke="#6e6e73" stroke-width="1.6">
    <circle r="6" stroke-dasharray="2.4 2.3" stroke-width="3"/>
    <circle r="4.5"/>
    <circle r="1.8"/>
  </g>
</svg>
